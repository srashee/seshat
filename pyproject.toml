[tool.pytest.ini_options]
testpaths = ["seshat/tests", "tests"]
pythonpath = ["seshat"]
asyncio_mode = "auto"
markers = ["ml: requires locally acquired, checksum-verified model files"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
