services:
  seshat:
    build:
      context: ./seshat
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SESHAT_API_KEY: ${SESHAT_API_KEY:?Set a random API key of at least 32 characters in .env}
    volumes:
      - seshat_data:/data
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  seshat_data:
